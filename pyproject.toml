[project]
name = "snow-utils-pat"
version = "0.1.0"
description = "Snowflake PAT (Programmatic Access Token) manager - a snow-utils plugin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "keyring>=25.0",
    "python-dotenv>=1.2.1",
    "requests>=2.28",
    "snowflake-cli>=3.16.0",
    "snowflake-connector-python>=3.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
snow-utils-pat = "snow_utils_pat:cli"
check-setup = "snow_utils_pat.check_setup:check"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snow_utils_pat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
